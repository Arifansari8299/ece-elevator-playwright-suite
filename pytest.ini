[pytest]
minversion = 7.0
pythonpath = .
testpaths = tests
addopts = -v --browser chromium --screenshot only-on-failure --tracing retain-on-failure
markers =
    smoke: Quick sanity smoke tests
    regression: Full regression test suite
    auth: Authentication and Authorization tests
    production: Production analysis & machine monitoring tests
    maintenance: Maintenance analysis & electrical health tests
    alerts: Alert management and threshold rule tests
    reports: Report generation and export tests
    users: User management and RBAC tests
    api: FastAPI direct integration and contract tests
